<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="20" y="20" width="1160" height="400" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="20" y="20" width="1160" height="56" rx="16" fill="#161b22"/>
  <rect x="20" y="60" width="1160" height="16" fill="#161b22"/>
  <circle cx="56" cy="48" r="8" fill="#f85149"/>
  <circle cx="84" cy="48" r="8" fill="#d29922"/>
  <circle cx="112" cy="48" r="8" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.35;1" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="56" text-anchor="middle" font-size="20" fill="#8b949e">mpf &#8212; live analysis</text>

  <!-- line 1: command -->
  <text x="60" y="132" font-size="24" fill="#e6edf3">
    <tspan fill="#3fb950" font-weight="bold">$ </tspan>mpf analyze target.apk
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.029;0.034;0.914;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <!-- line 2: phase -->
  <text x="60" y="172" font-size="24" fill="#8b949e">&#9656; unpacking APK &#183; 6-phase static analysis
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.114;0.119;0.914;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <!-- progress bar -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.157;0.162;0.914;1" dur="14s" repeatCount="indefinite"/>
    <rect x="60" y="196" width="520" height="18" rx="9" fill="#21262d"/>
    <rect x="60" y="196" width="0" height="18" rx="9" fill="url(#bar)">
      <animate attributeName="width" values="0;0;520;520;0" keyTimes="0;0.157;0.371;0.914;1" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- line 3: done -->
  <text x="60" y="262" font-size="24" fill="#e6edf3">
    <tspan fill="#3fb950" font-weight="bold">[&#10003;]</tspan> scan complete &#8212; 25 findings in 3.1s
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.386;0.391;0.914;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <!-- line 4: severities -->
  <text x="60" y="302" font-size="24" fill="#e6edf3">  <tspan fill="#f85149" font-weight="bold">CRITICAL 4</tspan><tspan fill="#8b949e">  &#183;  </tspan><tspan fill="#d29922" font-weight="bold">HIGH 9</tspan><tspan fill="#8b949e">  &#183;  </tspan><tspan fill="#e3b341" font-weight="bold">MEDIUM 12</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.457;0.462;0.914;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <!-- line 5: chains -->
  <text x="60" y="342" font-size="24" fill="#8b949e">&#9656; 3 attack chains correlated <tspan fill="#58a6ff">(M1 &#8594; M2 &#8594; M7)</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.529;0.534;0.914;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <!-- line 6: report -->
  <text x="60" y="382" font-size="24" fill="#e6edf3">&#9656; report written <tspan fill="#3fb950">&#8594;</tspan> mpf_report.html
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.605;0.914;1" dur="14s" repeatCount="indefinite"/>
  </text>

  <!-- blinking cursor -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.671;0.676;0.914;1" dur="14s" repeatCount="indefinite"/>
    <rect x="60" y="398" width="14" height="26" fill="#3fb950">
      <animate attributeName="opacity" values="1;0" keyTimes="0;1" dur="0.9s" begin="9.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
