# MPF — full-stack reverse-engineering & static-analysis platform.
#
#   postgres   persistent metadata store
#   redis      Celery broker/result backend + API response cache
#   backend    FastAPI app (carries the Android toolchain)
#   worker     Celery worker running the decompilation pipeline
#
# The `storage/` bind mount is the permanent artifact store shared between the
# API (reads/streams files) and the worker (writes decompiled output).
name: mpf

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mpf
      POSTGRES_PASSWORD: mpf
      POSTGRES_DB: mpf
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpf"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MPF_DATABASE_URL: postgresql+psycopg://mpf:mpf@postgres:5432/mpf
      MPF_REDIS_URL: redis://redis:6379/0
      MPF_STORAGE_ROOT: /data/storage
    volumes:
      - ./storage:/data/storage
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MPF_DATABASE_URL: postgresql+psycopg://mpf:mpf@postgres:5432/mpf
      MPF_REDIS_URL: redis://redis:6379/0
      MPF_STORAGE_ROOT: /data/storage
    volumes:
      - ./storage:/data/storage
    command: celery -A app.workers.celery_app.celery worker --loglevel=info --concurrency=2

volumes:
  pgdata:
