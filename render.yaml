services:
  # Backend
  - type: web
    name: mpf-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend

    healthCheckPath: /health

    envVars:
      - key: MPF_DATABASE_URL
        fromDatabase:
          name: mpf-postgres
          property: connectionString

      - key: MPF_STORAGE_ROOT
        value: /tmp/storage

      - key: MPF_ENVIRONMENT
        value: production

      - key: MPF_CORS_ORIGINS
        value: '["https://mpf-frontend.onrender.com"]'

  # Frontend
  - type: web
    name: mpf-frontend
    runtime: static

    rootDir: frontend

    buildCommand: npm install && npm run build

    staticPublishPath: dist

databases:
  - name: mpf-postgres
    databaseName: mpf
    user: mpf
