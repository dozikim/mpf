# Render Blueprint Specification for MPF
# https://render.com/docs/blueprint-spec

services:
  # 1. Backend FastAPI Service
  - type: web
    name: mpf-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: MPF_DATABASE_URL
        fromDatabase:
          name: mpf-postgres
          property: connectionString
      - key: MPF_REDIS_URL
        fromKeyStore:
          type: key-store
          name: mpf-redis
          property: connectionString
      - key: MPF_STORAGE_ROOT
        value: /data/storage
      - key: MPF_CORS_ORIGINS
        value: '["*"]'
    startCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health

  # 2. Celery Worker Service
  - type: worker
    name: mpf-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: MPF_DATABASE_URL
        fromDatabase:
          name: mpf-postgres
          property: connectionString
      - key: MPF_REDIS_URL
        fromKeyStore:
          type: key-store
          name: mpf-redis
          property: connectionString
      - key: MPF_STORAGE_ROOT
        value: /data/storage
    startCommand: celery -A app.workers.celery_app.celery worker --loglevel=info --concurrency=2

  # 3. Frontend Static Site
  - type: web
    name: mpf-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: mpf-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: mpf-postgres
    databaseName: mpf
    user: mpf

keyStores:
  - name: mpf-redis
